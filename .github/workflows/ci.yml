
name: AI Test Case Generator CI
on:
  push:
    branches: [master]
  pull_request:          
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Build image
          run: docker build -t test-case-generator .

        - name: Run tests
          env:
            GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          run: docker run --rm -e GROQ_API_KEY=$GROQ_API_KEY test-case-generator pytest tests/
